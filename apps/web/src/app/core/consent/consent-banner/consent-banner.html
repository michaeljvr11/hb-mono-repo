@if (visible()) {
  <div class="consent-banner" role="region" aria-label="Cookie consent">
    <p class="consent-banner__text">
      HB uses analytics cookies to understand how the storefront is used and improve it. Your
      choice is stored on this device and you can change it at any time. See our POPIA notice for
      details.
    </p>
    <div class="consent-banner__actions">
      <button
        type="button"
        class="consent-banner__btn consent-banner__btn--decline"
        (click)="decline()"
      >
        Decline
      </button>
      <button
        type="button"
        class="consent-banner__btn consent-banner__btn--accept"
        (click)="accept()"
      >
        Accept
      </button>
    </div>
  </div>
}
