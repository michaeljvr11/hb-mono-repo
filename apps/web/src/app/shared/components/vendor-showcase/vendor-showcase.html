<div class="vendor-showcase" role="list" aria-label="Featured SME vendors">
  @for (vendor of vendors(); track vendor.id) {
    <button
      type="button"
      class="vendor-card"
      role="listitem"
      (click)="select(vendor)"
    >
      @if (logo(vendor); as logo) {
        <img
          class="vendor-card__avatar vendor-card__avatar--logo"
          [src]="logo.src"
          [attr.srcset]="logo.srcset"
          [attr.sizes]="logo.srcset ? '56px' : null"
          alt=""
          loading="lazy"
        />
      } @else {
        <div class="vendor-card__avatar" aria-hidden="true">{{ initials(vendor) }}</div>
      }

      <div class="vendor-card__body">
        <div class="vendor-card__name-row">
          <h3 class="vendor-card__name">{{ displayName(vendor) }}</h3>
          @if (isApproved(vendor)) {
            <span class="vendor-card__approved" title="Approved by H&amp;B">
              <span class="material-symbols-outlined" aria-hidden="true">verified</span>
              <span class="vendor-card__approved-text">Approved</span>
            </span>
          }
        </div>

        <p class="vendor-card__line">
          <span class="material-symbols-outlined vendor-card__line-icon" aria-hidden="true">local_shipping</span>
          Ships from {{ countryLabel(vendor.countryCode) }}
        </p>

        @if (listingCount(vendor); as count) {
          <p class="vendor-card__line vendor-card__line--count">
            <span class="material-symbols-outlined vendor-card__line-icon" aria-hidden="true">inventory_2</span>
            {{ count }} listing{{ count === 1 ? '' : 's' }}
          </p>
        }
      </div>

      <span class="material-symbols-outlined vendor-card__chevron" aria-hidden="true">chevron_right</span>
    </button>
  }
</div>
