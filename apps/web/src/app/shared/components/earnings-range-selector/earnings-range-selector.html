<div class="earnings-range-selector">
  <div class="filter-tabs" role="tablist" aria-label="Reporting window">
    @for (tab of windowTabs(); track tab.value) {
      <button
        class="tab-btn"
        role="tab"
        [class.tab-btn--active]="selectedPreset() === tab.value"
        [attr.aria-selected]="selectedPreset() === tab.value"
        type="button"
        (click)="selectPreset(tab.value)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <form class="custom-range" [formGroup]="rangeForm">
    <mat-form-field appearance="outline" class="range-field" subscriptSizing="dynamic">
      <mat-label>Custom start</mat-label>
      <input matInput [matDatepicker]="startPicker" formControlName="start" [max]="maxDate" />
      <mat-datepicker-toggle matSuffix [for]="startPicker" aria-label="Choose custom start date"></mat-datepicker-toggle>
      <mat-datepicker #startPicker></mat-datepicker>
    </mat-form-field>

    <span class="range-field-sep" aria-hidden="true">–</span>

    <mat-form-field appearance="outline" class="range-field" subscriptSizing="dynamic">
      <mat-label>Custom end</mat-label>
      <input matInput [matDatepicker]="endPicker" formControlName="end" [max]="maxDate" />
      <mat-datepicker-toggle matSuffix [for]="endPicker" aria-label="Choose custom end date"></mat-datepicker-toggle>
      <mat-datepicker #endPicker></mat-datepicker>
    </mat-form-field>

    @if (rangeError(); as message) {
      <p class="range-error" role="alert">{{ message }}</p>
    }
  </form>
</div>
