<section
  class="trust-banner"
  [class.trust-banner--strip]="variant() === 'strip'"
  [class.trust-banner--cards]="variant() === 'cards'"
  [class.trust-banner--inline]="variant() === 'inline'"
  [attr.aria-label]="label()"
>
  <ol class="trust-banner__grid">
    @for (item of items(); track item.title; let last = $last) {
      <li class="trust-card" [class.trust-card--destination]="variant() === 'strip' && last">
        <span class="trust-card__waypoint" aria-hidden="true"></span>
        <div
          class="trust-card__icon-wrap"
          [class.trust-card__icon-wrap--secondary]="item.tone === 'secondary'"
          [class.trust-card__icon-wrap--tertiary]="item.tone === 'tertiary'"
          aria-hidden="true"
        >
          <span class="material-symbols-outlined trust-card__icon">{{ item.icon }}</span>
        </div>
        <div class="trust-card__body">
          @if (variant() === 'inline') {
            <p class="trust-card__label">{{ item.short ?? item.title }}</p>
          } @else {
            <h3 class="trust-card__title">{{ item.title }}</h3>
            <p class="trust-card__desc">{{ item.description }}</p>
          }
        </div>
      </li>
    }
  </ol>
</section>
