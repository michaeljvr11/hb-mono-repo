<header class="nav-bar" role="banner">
  <div class="nav-bar__inner">
    <!-- Brand -->
    <div class="nav-bar__brand-group">
      <a class="nav-bar__brand" routerLink="/shop" aria-label="H&B E-Commerce home">
        <img
          class="nav-bar__logo"
          [src]="brandLogo"
          width="44"
          height="44"
          alt=""
          aria-hidden="true"
        />
        H&amp;B E-Commerce
      </a>
    </div>

    <!-- Desktop nav links -->
    <nav class="nav-bar__links" aria-label="Primary navigation">
      <a
        class="nav-bar__link"
        routerLink="/shop"
        routerLinkActive="nav-bar__link--active"
        ariaCurrentWhenActive="page"
      >Home</a>
      <a
        class="nav-bar__link"
        routerLink="/about"
        routerLinkActive="nav-bar__link--active"
        ariaCurrentWhenActive="page"
      >About</a>
      <a
        class="nav-bar__link"
        routerLink="/services"
        routerLinkActive="nav-bar__link--active"
        ariaCurrentWhenActive="page"
      >Services</a>
      <a
        class="nav-bar__link"
        routerLink="/contact"
        routerLinkActive="nav-bar__link--active"
        ariaCurrentWhenActive="page"
      >Contact</a>
    </nav>

    <!-- Sell on H&B entry -->
    <a
      class="nav-bar__link nav-bar__link--sell"
      routerLink="/vendor/apply"
      routerLinkActive="nav-bar__link--active"
      ariaCurrentWhenActive="page"
    >Sell on H&amp;B</a>

    <!-- Desktop utilities -->
    <div class="nav-bar__utils">
      <div class="nav-bar__divider" aria-hidden="true"></div>
      <button
        type="button"
        class="nav-bar__currency"
        (click)="notifyComingSoon('Currency switcher')"
        aria-label="Switch currency"
      >
        <span class="nav-bar__currency-label">ZAR/NAD</span>
        <span class="material-symbols-outlined nav-bar__expand-icon" aria-hidden="true">expand_more</span>
      </button>
    </div>

    <!-- Action icons -->
    <div class="nav-bar__actions">
      <button
        type="button"
        class="nav-bar__icon-btn"
        aria-label="Search"
        (click)="onSearchClick()"
      >
        <span class="material-symbols-outlined" aria-hidden="true">search</span>
      </button>
      <button
        type="button"
        class="nav-bar__wishlist-btn"
        aria-label="View wishlist"
        (click)="onWishlistClick()"
      >
        <span class="material-symbols-outlined" aria-hidden="true">favorite</span>
      </button>
      <button
        type="button"
        class="nav-bar__cart-btn"
        aria-label="View cart"
        (click)="onCartClick()"
      >
        <span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span>
        <span class="nav-bar__cart-label">Cart</span>
        @if (cartCount() > 0) {
          <span class="nav-bar__cart-badge" aria-label="Items in cart">{{ cartCount() }}</span>
        }
      </button>

      <!-- Auth controls: sign-in (anonymous) or account + sign-out (authenticated) -->
      @if (isAuthenticated()) {
        <a
          class="nav-bar__account"
          routerLink="/profile"
          aria-label="View your profile"
        >
          <span class="material-symbols-outlined nav-bar__account-icon" aria-hidden="true">person</span>
          <span class="nav-bar__account-name">{{ accountLabel() }}</span>
        </a>
        <button
          type="button"
          class="nav-bar__signout"
          (click)="signOut()"
          aria-label="Sign out"
        >
          <span class="material-symbols-outlined" aria-hidden="true">logout</span>
          <span class="nav-bar__signout-label">Sign out</span>
        </button>
      } @else {
        <a
          class="nav-bar__signin"
          routerLink="/login"
          aria-label="Sign in to your account"
        >
          <span class="material-symbols-outlined nav-bar__signin-icon" aria-hidden="true">login</span>
          <span class="nav-bar__signin-label">Sign in</span>
        </a>
      }
    </div>
  </div>
</header>
