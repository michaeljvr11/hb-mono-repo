<header class="nav-bar" role="banner">
  <div class="nav-bar__inner">
    <!-- Brand -->
    <div class="nav-bar__brand-group">
      <!-- Below 360px the wordmark is hidden and the mark stands alone; the
           anchor's aria-label carries the accessible name at every width. -->
      <a class="nav-bar__brand" routerLink="/shop" aria-label="H&B E-Commerce storefront home">
        <img
          class="nav-bar__logo"
          [src]="brandLogo"
          width="64"
          height="64"
          alt=""
          aria-hidden="true"
        />
        <span class="nav-bar__brand-name">H&amp;B E-Commerce</span>
      </a>
    </div>


    <!-- Trailing group: sell entry, utilities, and action icons all move as one
         block on the right now that the desktop links nav is gone — without this
         wrapper, `justify-content: space-between` on `.nav-bar__inner` would
         spread these three siblings apart instead of keeping them together. -->
    <div class="nav-bar__trailing">
      <!-- Sell on H&B entry -->
      <a
        class="nav-bar__link nav-bar__link--sell"
        routerLink="/vendor/apply"
        routerLinkActive="nav-bar__link--active"
        ariaCurrentWhenActive="page"
      >Sell on H&amp;B</a>

      <!-- Desktop utilities -->
      <div class="nav-bar__utils">
        <div class="nav-bar__divider" aria-hidden="true"></div>
        <button
          type="button"
          class="nav-bar__currency"
          (click)="notifyComingSoon('Currency switcher')"
          aria-label="Switch currency"
        >
          <span class="nav-bar__currency-label">ZAR/NAD</span>
          <span class="material-symbols-outlined nav-bar__expand-icon" aria-hidden="true">expand_more</span>
        </button>
      </div>

      <!-- Action icons -->
      <div class="nav-bar__actions">
        <button
          type="button"
          class="nav-bar__icon-btn"
          aria-label="Search"
          (click)="onSearchClick()"
        >
          <span class="material-symbols-outlined" aria-hidden="true">search</span>
        </button>
        <button
          type="button"
          class="nav-bar__wishlist-btn"
          aria-label="View wishlist"
          (click)="onWishlistClick()"
        >
          <span class="material-symbols-outlined" aria-hidden="true">favorite</span>
        </button>
        <button
          type="button"
          class="nav-bar__cart-btn"
          aria-label="View cart"
          (click)="onCartClick()"
        >
          <span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span>
          <span class="nav-bar__cart-label">Cart</span>
          @if (cartCount() > 0) {
            <span class="nav-bar__cart-badge" aria-label="Items in cart">{{ cartCount() }}</span>
          }
        </button>

        <!-- Auth controls: sign-in (anonymous) or account menu (authenticated) -->
        @if (isAuthenticated()) {
          <div class="nav-bar__account-wrap">
            <button
              type="button"
              class="nav-bar__account"
              aria-haspopup="menu"
              [attr.aria-expanded]="accountMenuOpen()"
              aria-controls="nav-bar-account-menu"
              aria-label="Account menu"
              (click)="toggleAccountMenu()"
            >
              <span class="material-symbols-outlined nav-bar__account-icon" aria-hidden="true">person</span>
              <span class="nav-bar__account-name">{{ accountLabel() }}</span>
              <span class="material-symbols-outlined nav-bar__account-caret" aria-hidden="true">expand_more</span>
            </button>

            @if (accountMenuOpen()) {
              <div class="nav-bar__account-scrim" (click)="closeAccountMenu()"></div>
              <div
                class="nav-bar__account-menu"
                id="nav-bar-account-menu"
                role="menu"
                aria-label="Account"
              >
                <a
                  class="nav-bar__account-menu-item"
                  role="menuitem"
                  routerLink="/profile/details"
                  (click)="closeAccountMenu()"
                >
                  <span class="material-symbols-outlined" aria-hidden="true">person</span>
                  Details
                </a>
                <a
                  class="nav-bar__account-menu-item"
                  role="menuitem"
                  routerLink="/profile/orders"
                  (click)="closeAccountMenu()"
                >
                  <span class="material-symbols-outlined" aria-hidden="true">shopping_bag</span>
                  Orders
                </a>
                <a
                  class="nav-bar__account-menu-item"
                  role="menuitem"
                  routerLink="/profile/addresses"
                  (click)="closeAccountMenu()"
                >
                  <span class="material-symbols-outlined" aria-hidden="true">home</span>
                  Addresses
                </a>
                <div class="nav-bar__account-menu-divider" role="separator"></div>
                <button
                  type="button"
                  class="nav-bar__account-menu-item nav-bar__account-menu-item--danger"
                  role="menuitem"
                  (click)="signOut()"
                >
                  <span class="material-symbols-outlined" aria-hidden="true">logout</span>
                  Sign out
                </button>
              </div>
            }
          </div>
        } @else {
          <a
            class="nav-bar__signin"
            routerLink="/login"
            aria-label="Sign in to your account"
          >
            <span class="material-symbols-outlined nav-bar__signin-icon" aria-hidden="true">login</span>
            <span class="nav-bar__signin-label">Sign in</span>
          </a>
        }
      </div>
    </div>
  </div>
</header>
