name: AI Evidence

# Compiles the AI-usage evidence report on every PR and posts the headline as a
# sticky comment, so each PR visibly shows its AI contribution. The report keeps
# accumulating with no manual bookkeeping — by demo time the numbers are ready.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  evidence:
    name: Compile & post evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the generator mines all commits
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile evidence (zero-dep generator)
        env:
          GH_TOKEN: ${{ github.token }} # lets the generator read PRs via gh
        run: node docs/ai-evidence/generate.mjs
      - name: Upload full report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-evidence-report
          path: |
            docs/ai-evidence/REPORT.md
            docs/ai-evidence/report.json
      - name: Post evidence headline as a sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('docs/ai-evidence/report.json', 'utf8'));
            const g = d.git || {};
            const t = d.telemetry || {};
            const marker = '<!-- ai-evidence -->';
            const body = [
              marker,
              '## 🤖 AI Factory — evidence for this branch',
              '',
              `- **${g.totalCommits ?? 0}** commits · **${g.aiCommits ?? 0}** AI-tagged (**${g.aiPct ?? 0}%**)`,
              `- **+${(g.ins ?? 0).toLocaleString()} / −${(g.del ?? 0).toLocaleString()}** authored lines across **${g.filesTouched ?? 0}** files`,
              `- **${d.tests?.total ?? 0}** test specs · guardrails fired: **${t.prodBlocks ?? 0}** prod blocks, **${t.gatePass ?? 0}** green gates`,
              '',
              '_Full report is attached as the `ai-evidence-report` artifact. Methodology: `docs/ai-evidence/README.md`._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
