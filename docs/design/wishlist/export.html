<!-- @dsCard group="Screens" name="Wishlist" -->
<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>ZANAM Market | Wishlist</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "background": "#fcf9f8",
                    "primary": "#015300",
                    "primary-container": "#026e00",
                    "on-primary": "#ffffff",
                    "on-surface-variant": "#404a3b",
                    "surface-variant": "#e5e2e1",
                    "surface-container": "#f0eded",
                    "outline": "#707a6a",
                    "outline-variant": "#bfcab7",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-low": "#f6f3f2",
                    "surface": "#fcf9f8",
                    "error": "#ba1a1a",
                    "on-surface": "#1c1b1b"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-lg": "24px",
                    "stack-xl": "48px",
                    "stack-xs": "4px",
                    "margin-mobile": "16px",
                    "unit": "8px",
                    "margin-desktop": "40px",
                    "gutter": "24px",
                    "stack-sm": "8px",
                    "container-max": "1280px",
                    "stack-md": "16px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "title-lg": ["Inter"],
                    "label-lg": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
  </head>
<body class="bg-background text-on-surface font-body-md overflow-x-hidden pb-32">
<!-- TopAppBar (shared NavBar in the app) -->
<header class="w-full top-0 sticky z-40 bg-surface border-b border-outline-variant flex justify-between items-center px-margin-mobile py-stack-md max-w-container-max mx-auto">
<h1 class="text-headline-md font-headline-md font-bold text-primary">H&amp;B Market</h1>
<div class="flex items-center gap-stack-md">
<span class="material-symbols-outlined text-primary">favorite</span>
<span class="material-symbols-outlined text-primary">shopping_cart</span>
</div>
</header>

<main class="max-w-container-max mx-auto px-margin-mobile pt-stack-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-lg">Your Wishlist</h2>

<!-- ══════════════════════════════════════════════════════════════════
     STATE: Loaded — item rows (in-stock + out-of-stock)
     ══════════════════════════════════════════════════════════════════ -->
<ul class="flex flex-col rounded-xl border border-outline-variant bg-surface-container-lowest overflow-hidden divide-y divide-outline-variant">

<!-- Row 1: in-stock, ZAR -->
<li class="flex gap-stack-md p-stack-md items-start">
<img class="w-20 h-20 object-cover rounded-lg border border-outline-variant" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAcKqx6kqKpEsicTEXmjvIqdKe1QNPP1U7uKTw5APqplECoM7Zm2WNqny1DBWU_KME12K6K17mHSL2TNEXF3ioBcwomTNVi4RZHlGLiiSEyfzo-QYG9ZLiybpaW6lI8u0t6okV7aJ2-L_QPrm02BQZd22ZM0p8lZavOfY5CkeECvz2ePXFbKjIZhfaPPO2inau73w6mzok-vSvrzmJCq1mYXI0nXs4FSe6dmCt6AtZ5WAeXByGwD83bKdWIpERzDFaN8OU_C1CtqqYc" alt="Organic Fynbos Honey 500g">
<div class="flex-1 flex flex-col gap-stack-xs min-w-0">
<a class="font-body-md text-on-surface font-semibold" href="#">Organic Fynbos Honey 500g</a>
<span class="font-headline-md text-primary text-body-md font-bold">R 145.00</span>
<div class="flex items-center gap-stack-md mt-stack-xs flex-wrap">
<button class="inline-flex items-center gap-1 bg-primary text-on-primary px-stack-md py-2 rounded-lg font-label-lg text-label-lg">
<span class="material-symbols-outlined text-[18px]">add_shopping_cart</span>Add to Cart</button>
<button class="inline-flex items-center gap-1 text-error font-label-lg text-label-lg px-2 py-1 rounded-lg">
<span class="material-symbols-outlined text-[18px]">delete</span>Remove</button>
</div>
</div>
</li>

<!-- Row 2: out-of-stock, NAD -->
<li class="flex gap-stack-md p-stack-md items-start">
<div class="w-20 h-20 rounded-lg border border-outline-variant bg-surface-container-low flex items-center justify-center text-outline flex-shrink-0">
<span class="material-symbols-outlined">image</span>
</div>
<div class="flex-1 flex flex-col gap-stack-xs min-w-0">
<a class="font-body-md text-on-surface font-semibold" href="#">Namib Desert Salt 250g</a>
<span class="font-headline-md text-primary text-body-md font-bold">N$ 19.99</span>
<span class="self-start font-label-sm text-label-sm font-semibold text-error bg-[color-mix(in_srgb,#ba1a1a_12%,transparent)] px-stack-sm py-[2px] rounded-full">Out of stock</span>
<div class="flex items-center gap-stack-md mt-stack-xs flex-wrap">
<button class="inline-flex items-center gap-1 bg-outline-variant text-on-surface-variant px-stack-md py-2 rounded-lg font-label-lg text-label-lg cursor-not-allowed" disabled>
<span class="material-symbols-outlined text-[18px]">add_shopping_cart</span>Add to Cart</button>
<button class="inline-flex items-center gap-1 text-error font-label-lg text-label-lg px-2 py-1 rounded-lg">
<span class="material-symbols-outlined text-[18px]">delete</span>Remove</button>
</div>
</div>
</li>

</ul>

<!-- ══════════════════════════════════════════════════════════════════
     STATE: Empty — no saved products
     ══════════════════════════════════════════════════════════════════ -->
<div class="hidden flex-col items-center gap-stack-sm text-center py-stack-xl text-on-surface-variant border border-outline-variant rounded-xl bg-surface-container-low mt-stack-lg">
<span class="material-symbols-outlined text-[48px] opacity-50">favorite</span>
<h3 class="font-headline-md text-headline-md text-on-surface">Your wishlist is empty</h3>
<p class="font-body-md text-body-md">Save products you love and find them here later.</p>
<a class="inline-flex items-center bg-primary text-on-primary px-stack-lg py-stack-sm rounded-lg font-label-lg text-label-lg mt-stack-sm" href="#">Browse products</a>
</div>

</main>
</body></html>
